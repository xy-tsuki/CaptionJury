<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>听写</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">听写</div>
    <nav class="nav" aria-label="主导航">
      <a href="#new" data-v="new"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg><span>新建</span></a>
      <a href="#progress" data-v="progress"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h8M2 12h5"/></svg><span>进度</span><b class="badge mono" id="navpct" hidden></b></a>
      <a href="#review" data-v="review"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3" width="13" height="10"/><path d="M4 10.2h5M10.6 10.2H12M4 7.4h2M7.6 7.4H12"/></svg><span>校对</span></a>
      <a href="#history" data-v="history"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/></svg><span>历史</span></a>
      <a href="#settings" data-v="settings" class="nav-end"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><rect x="9" y="3" width="3" height="3"/><rect x="4" y="10" width="3" height="3"/></svg><span>设置</span></a>
    </nav>
    <div class="sys mono" id="sys"></div>
  </aside>
  <div id="view" class="view"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
