# 构建安装包。
# - 推送 vX.Y.Z 格式的 tag：构建安装包，发布同名 Release，附上 Tingxie-Setup-X.Y.Z.exe。
# - 在 Actions 页面手动运行：只构建，安装包作为构建产物（artifact）下载，不发 Release，用来发版前试装。
name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 检查 tag 和 core/version.py 一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path core/version.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} 和 core/version.py 里的 $v 不一致" }

      - name: 单元测试
        run: |
          pip install -r requirements.txt
          python tests/speakers_unit.py
          python tests/deepseek_unit.py
          python tests/backups_unit.py
          python tests/download_unit.py

      - name: 准备 Inno Setup 6.5 以上
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ver = if (Test-Path $iscc) { (Get-Item $iscc).VersionInfo.ProductVersion } else { "0" }
          Write-Host "已有 Inno Setup：$ver"
          if ([version]($ver -replace '[^\d.]', '') -lt [version]"6.5") { choco install innosetup -y --no-progress }

      - name: 构建
        shell: pwsh
        run: ./packaging/build.ps1

      - uses: actions/upload-artifact@v6
        with:
          name: installer
          path: build/installer/*.exe

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem build/installer/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $notes = Get-Content packaging/release-notes.md -Raw -Encoding utf8
          $notes = $notes.Replace("{SHA256}", $hash).Replace("{FILE}", $exe.Name)
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release create "${{ github.ref_name }}" $exe.FullName --title "听写 ${{ github.ref_name }}" --notes-file notes.md
