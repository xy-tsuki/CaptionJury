name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    # DPAPI (pywin32) and WebView2 are Windows-only
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py core tests
      # Unit tests only: they need no models, GPU or network
      - run: python tests/speakers_unit.py
      - run: python tests/deepseek_unit.py
      - run: python tests/backups_unit.py
